<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>വിലങ്ങംപൊയിൽ മഹല്ല് - സ്ഥിതി വിവര കണക്ക്</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center text-green-800 mb-1">വിലങ്ങംപൊയിൽ മഹല്ല്</h1>
        <h2 class="text-xl font-semibold text-center text-gray-700 mb-6">മഹല്ല് സ്ഥിതി വിവര കണക്ക്</h2>

        <form id="mahalluForm" class="space-y-6">
            <!-- Basic Details -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-md border">
                <div>
                    <label class="block text-sm font-medium text-gray-700">ഗൃഹനാഥൻ്റെ പേര്:</label>
                    <input type="text" id="grihanathan" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">പഞ്ചായത്ത്:</label>
                    <input type="text" id="panchayat" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">വാർഡ് നമ്പർ:</label>
                    <input type="text" id="wardNo" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">വീട് നമ്പർ:</label>
                    <input type="text" id="houseNo" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">മഹല്ല്:</label>
                    <input type="text" id="mahallu" value="വിലങ്ങംപൊയിൽ മഹല്ല്" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">വീട്ടുപേര്:</label>
                    <input type="text" id="veettuperu" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                </div>
            </div>

            <!-- Members Table -->
            <div class="overflow-x-auto">
                <h3 class="text-lg font-medium text-gray-800 mb-2">അംഗങ്ങളുടെ വിവരങ്ങൾ</h3>
                <table class="min-w-full divide-y divide-gray-200 border" id="membersTable">
                    <thead class="bg-gray-50 text-xs">
                        <tr>
                            <th class="px-2 py-2">നമ്പർ</th>
                            <th class="px-2 py-2">പേരും വീട്ടുപേരും</th>
                            <th class="px-2 py-2">ഫോൺ നമ്പർ</th>
                            <th class="px-2 py-2">ഗൃഹനാഥനുമായുള്ള ബന്ധം</th>
                            <th class="px-2 py-2">തിയ്യതി</th>
                            <th class="px-2 py-2">ജോലി</th>
                            <th class="px-2 py-2">സ്വദേശത്തോ വിദേശത്തോ</th>
                            <th class="px-2 py-2">മതം</th>
                            <th class="px-2 py-2">വിദ്യാഭ്യാസ യോഗ്യത (ഭൗതികം)</th>
                            <th class="px-2 py-2">വൈവാഹിക സ്ഥിതി</th>
                            <th class="px-2 py-2">മാറ്റം</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200 text-sm" id="memberRows">
                        <tr>
                            <td class="px-2 py-2 text-center">1</td>
                            <td class="px-2 py-2"><input type="text" class="w-28 border p-1 rounded name" required></td>
                            <td class="px-2 py-2"><input type="text" class="w-24 border p-1 rounded phone"></td>
                            <td class="px-2 py-2"><input type="text" class="w-20 border p-1 rounded relation"></td>
                            <td class="px-2 py-2"><input type="date" class="w-28 border p-1 rounded dob"></td>
                            <td class="px-2 py-2"><input type="text" class="w-20 border p-1 rounded job"></td>
                            <td class="px-2 py-2">
                                <select class="w-24 border p-1 rounded location">
                                    <option value="സ്വദേശം">സ്വദേശം</option>
                                    <option value="വിദേശം">വിദേശം</option>
                                </select>
                            </td>
                            <td class="px-2 py-2"><input type="text" class="w-16 border p-1 rounded religion" value="ഇസ്ലാം"></td>
                            <td class="px-2 py-2"><input type="text" class="w-24 border p-1 rounded education"></td>
                            <td class="px-2 py-2">
                                <select class="w-24 border p-1 rounded marital">
                                    <option value="അവിവാഹിതം">അവിവാഹിതം</option>
                                    <option value="വിവാഹിതം">വിവാഹിതം</option>
                                </select>
                            </td>
                            <td class="px-2 py-2 text-center">
                                <button type="button" onclick="removeRow(this)" class="text-red-600 font-bold">X</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <button type="button" onclick="addRow()" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">+ അംഗത്തെ ചേർക്കുക</button>
            </div>

            <!-- Submit Button -->
            <div class="text-center pt-4">
                <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded-lg font-semibold shadow hover:bg-green-700 w-full md:w-auto">വിവരങ്ങൾ സേവ് ചെയ്യുക</button>
            </div>
        </form>
    </div>

    <!-- Firebase Script -->
    <script>
        // നിങ്ങളുടെ Firebase പ്രോജക്റ്റ് വിവരങ്ങൾ ഇവിടെ നൽകുക
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function addRow() {
            const tbody = document.getElementById('memberRows');
            const rowCount = tbody.rows.length + 1;
            const newRow = tbody.insertRow();
            newRow.innerHTML = `
                <td class="px-2 py-2 text-center">${rowCount}</td>
                <td class="px-2 py-2"><input type="text" class="w-28 border p-1 rounded name" required></td>
                <td class="px-2 py-2"><input type="text" class="w-24 border p-1 rounded phone"></td>
                <td class="px-2 py-2"><input type="text" class="w-20 border p-1 rounded relation"></td>
                <td class="px-2 py-2"><input type="date" class="w-28 border p-1 rounded dob"></td>
                <td class="px-2 py-2"><input type="text" class="w-20 border p-1 rounded job"></td>
                <td class="px-2 py-2">
                    <select class="w-24 border p-1 rounded location">
                        <option value="സ്വദേശം">സ്വദേശം</option>
                        <option value="വിദേശം">വിദേശം</option>
                    </select>
                </td>
                <td class="px-2 py-2"><input type="text" class="w-16 border p-1 rounded religion" value="ഇസ്ലാം"></td>
                <td class="px-2 py-2"><input type="text" class="w-24 border p-1 rounded education"></td>
                <td class="px-2 py-2">
                    <select class="w-24 border p-1 rounded marital">
                        <option value="അവിവാഹിതം">അവിവാഹിതം</option>
                        <option value="വിവാഹിതം">വിവാഹിതം</option>
                    </select>
                </td>
                <td class="px-2 py-2 text-center">
                    <button type="button" onclick="removeRow(this)" class="text-red-600 font-bold">X</button>
                </td>
            `;
        }

        function removeRow(btn) {
            const row = btn.closest('tr');
            row.remove();
        }

        document.getElementById('mahalluForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const grihanathan = document.getElementById('grihanathan').value;
            const veettuperu = document.getElementById('veettuperu').value;
            const panchayat = document.getElementById('panchayat').value;
            const wardNo = document.getElementById('wardNo').value;
            const houseNo = document.getElementById('houseNo').value;
            const mahallu = document.getElementById('mahallu').value;

            let members = [];
            const rows = document.querySelectorAll('#memberRows tr');
            rows.forEach((row, index) => {
                members.push({
                    slNo: index + 1,
                    name: row.querySelector('.name').value,
                    phone: row.querySelector('.phone').value,
                    relation: row.querySelector('.relation').value,
                    dob: row.querySelector('.dob').value,
                    job: row.querySelector('.job').value,
                    location: row.querySelector('.location').value,
                    religion: row.querySelector('.religion').value,
                    education: row.querySelector('.education').value,
                    marital: row.querySelector('.marital').value
                });
            });

            const formData = {
                grihanathan,
                veettuperu,
                panchayat,
                wardNo,
                houseNo,
                mahallu,
                members,
                timestamp: new Date().toISOString()
            };

            database.ref('mahallu_surveys/' + Date.now()).set(formData)
                .then(() => {
                    alert('വിവരങ്ങൾ വിജയകരമായി സേവ് ചെയ്തു!');
                    document.getElementById('mahalluForm').reset();
                })
                .catch((error) => {
                    alert('പിശക് സംഭവിച്ചു: ' + error.message);
                });
        });
    </script>
</body>
</html>
