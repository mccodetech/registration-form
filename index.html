<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>വിലങ്ങംപൊയിൽ മഹല്ല് - സ്ഥിതി വിവര കണക്ക്</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Manjari for Malayalam) -->
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-100 p-4 md:p-8 min-h-screen">
    <div class="max-w-6xl mx-auto bg-white/90 backdrop-blur-md p-6 md:p-10 rounded-2xl shadow-2xl border border-emerald-100">
        
        <!-- Header Section & Navigation Tabs -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-4 gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-emerald-900 tracking-wide">വിലങ്ങംപൊയിൽ മഹല്ല്</h1>
                <p class="text-sm md:text-base font-semibold text-emerald-700 mt-1">മഹല്ല് സ്ഥിതി വിവര കണക്ക്</p>
            </div>
            <div class="flex gap-2 bg-emerald-100 p-1 rounded-xl">
                <button onclick="switchTab('form')" id="tabForm" class="px-4 py-2 rounded-lg text-sm font-bold bg-emerald-700 text-white shadow transition">സർവ്വെ ഫോം</button>
                <button onclick="switchTab('admin')" id="tabAdmin" class="px-4 py-2 rounded-lg text-sm font-bold text-emerald-800 hover:bg-emerald-200 transition">അഡ്മിൻ ഡാഷ്‌ബോർഡ്</button>
            </div>
        </div>

        <!-- 1. DATA ENTRY FORM SECTION -->
        <div id="sectionForm">
            <form id="mahalluForm" class="space-y-6">
                <!-- Basic Details Card -->
                <div class="bg-emerald-50/60 p-6 rounded-xl border border-emerald-200/60 shadow-sm">
                    <h2 class="text-md font-bold text-emerald-800 mb-4 flex items-center gap-2">🏠 ഗൃഹ വിവരങ്ങൾ</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">ഗൃഹനാഥൻ്റെ പേര്:</label>
                            <input type="text" id="grihanathan" required class="w-full bg-white rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">വീട്ടുപേര്:</label>
                            <input type="text" id="veettuperu" required class="w-full bg-white rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">പഞ്ചായത്ത്:</label>
                            <input type="text" id="panchayat" class="w-full bg-white rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">വാർഡ് നമ്പർ:</label>
                            <input type="text" id="wardNo" class="w-full bg-white rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">വീട് നമ്പർ:</label>
                            <input type="text" id="houseNo" class="w-full bg-white rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">മഹല്ല്:</label>
                            <input type="text" id="mahallu" value="വിലങ്ങംപൊയിൽ മഹല്ല്" class="w-full bg-white rounded-lg border border-gray-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- Members Section -->
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-800">👥 അംഗങ്ങളുടെ വിവരങ്ങൾ</h3>
                        <button type="button" onclick="addRow()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition">+ അംഗത്തെ ചേർക്കുക</button>
                    </div>

                    <div id="memberRows" class="space-y-4">
                        <!-- Default Member Card -->
                        <div class="member-card bg-gray-50/80 p-5 rounded-xl border border-gray-200 shadow-sm relative">
                            <div class="flex justify-between items-center mb-3 border-b pb-2">
                                <span class="bg-emerald-700 text-white text-xs font-bold px-2.5 py-1 rounded-full">അംഗം #<span class="sr-no">1</span></span>
                                <button type="button" onclick="removeRow(this)" class="text-red-500 hover:text-red-700 text-xs font-bold bg-red-50 px-2.5 py-1 rounded-lg">ഒഴിവാക്കുക X</button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">പേരും വീട്ടുപേരും:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg name" required></div>
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">ഫോൺ നമ്പർ:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg phone"></div>
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">ഗൃഹനാഥനുമായുള്ള ബന്ധം:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg relation"></div>
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">ജനന തീയ്യതി:</label><input type="date" class="w-full bg-white border border-gray-300 p-2 rounded-lg dob"></div>
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">ജോലി:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg job"></div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">സ്വദേശത്തോ വിദേശത്തോ:</label>
                                    <select class="w-full bg-white border border-gray-300 p-2 rounded-lg location"><option value="സ്വദേശം">സ്വദേശം</option><option value="വിദേശം">വിദേശം</option></select>
                                </div>
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">മതം:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg religion" value="ഇസ്ലാം"></div>
                                <div><label class="block text-xs font-bold text-gray-600 mb-1">വിദ്യാഭ്യാസ യോഗ്യത:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg education"></div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">വൈവാഹിക സ്ഥിതി:</label>
                                    <select class="w-full bg-white border border-gray-300 p-2 rounded-lg marital"><option value="അവിവാഹിതം">അവിവാഹിതം</option><option value="വിവാഹിതം">വിവാഹിതം</option></select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="text-center pt-6 border-t">
                    <button type="submit" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 text-white font-bold px-8 py-3 rounded-xl shadow-lg transition w-full md:w-auto">✨ വിവരങ്ങൾ സേവ് ചെയ്യുക</button>
                </div>
            </form>
        </div>

        <!-- 2. ADMIN DASHBOARD SECTION -->
        <div id="sectionAdmin" class="hidden space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-emerald-50 p-4 rounded-xl border">
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 വീട്ടുപേര് അല്ലെങ്കിൽ ഗൃഹനാഥൻ പേര് വെച്ച് തിരയുക..." class="w-full md:w-96 bg-white border border-gray-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                <div class="text-sm font-bold text-emerald-900 bg-white px-4 py-2 rounded-lg border shadow-sm">ആകെ കുടുംബങ്ങൾ: <span id="totalCount" class="text-emerald-700">0</span></div>
            </div>

            <!-- Table View -->
            <div class="overflow-x-auto bg-white rounded-xl border shadow-sm">
                <table class="min-w-full divide-y divide-gray-200 text-sm" id="adminTable">
                    <thead class="bg-emerald-800 text-white text-xs">
                        <tr>
                            <th class="px-3 py-3 text-center">നമ്പർ</th>
                            <th class="px-3 py-3 text-left">ഗൃഹനാഥൻ</th>
                            <th class="px-3 py-3 text-left">വീട്ടുപേര്</th>
                            <th class="px-3 py-3 text-center">വാർഡ് / വീട് നಂ</th>
                            <th class="px-3 py-3 text-center">അംഗങ്ങളുടെ എണ്ണം</th>
                            <th class="px-3 py-3 text-center">പ്രവർത്തനങ്ങൾ</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 text-gray-700" id="tableBody">
                        <!-- Data will load here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- VIEW DETAILS MODAL -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-emerald-900">കുടുംബത്തിന്റെ പൂർണ്ണ വിവരങ്ങൾ</h3>
                <button onclick="closeModal()" class="text-red-500 font-bold text-lg px-2">✕</button>
            </div>
            <div id="modalContent" class="space-y-4 text-sm">
                <!-- Details injected here -->
            </div>
            <div class="text-right mt-6 pt-3 border-t">
                <button onclick="closeModal()" class="bg-gray-600 text-white px-5 py-2 rounded-lg text-sm font-bold">അടയ്ക്കുക</button>
            </div>
        </div>
    </div>

    <!-- Firebase & App Logic Script -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzGRBflOY8-cNjECWGaPPOA-i4zrGfeIY",
            authDomain: "registration-form-bbacd.firebaseapp.com",
            projectId: "registration-form-bbacd",
            storageBucket: "registration-form-bbacd.firebasestorage.app",
            messagingSenderId: "729788425514",
            appId: "1:729788425514:web:e78dee44b1383ba2082a53",
            measurementId: "G-NWVDCF3DXM"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allSurveysData = {};

        // Tab Switching Logic
        function switchTab(tab) {
            const formSec = document.getElementById('sectionForm');
            const adminSec = document.getElementById('sectionAdmin');
            const tabForm = document.getElementById('tabForm');
            const tabAdmin = document.getElementById('tabAdmin');

            if(tab === 'form') {
                formSec.classList.remove('hidden');
                adminSec.classList.add('hidden');
                tabForm.className = "px-4 py-2 rounded-lg text-sm font-bold bg-emerald-700 text-white shadow transition";
                tabAdmin.className = "px-4 py-2 rounded-lg text-sm font-bold text-emerald-800 hover:bg-emerald-200 transition";
            } else {
                formSec.classList.add('hidden');
                adminSec.classList.remove('hidden');
                tabAdmin.className = "px-4 py-2 rounded-lg text-sm font-bold bg-emerald-700 text-white shadow transition";
                tabForm.className = "px-4 py-2 rounded-lg text-sm font-bold text-emerald-800 hover:bg-emerald-200 transition";
                loadAdminData();
            }
        }

        function updateSerialNumbers() {
            const cards = document.querySelectorAll('.member-card');
            cards.forEach((card, index) => {
                card.querySelector('.sr-no').innerText = index + 1;
            });
        }

        function addRow() {
            const container = document.getElementById('memberRows');
            const cardCount = container.children.length + 1;
            const newCard = document.createElement('div');
            newCard.className = 'member-card bg-gray-50/80 p-5 rounded-xl border border-gray-200 shadow-sm relative';
            newCard.innerHTML = `
                <div class="flex justify-between items-center mb-3 border-b pb-2">
                    <span class="bg-emerald-700 text-white text-xs font-bold px-2.5 py-1 rounded-full">അംഗം #<span class="sr-no">${cardCount}</span></span>
                    <button type="button" onclick="removeRow(this)" class="text-red-500 hover:text-red-700 text-xs font-bold bg-red-50 px-2.5 py-1 rounded-lg">ഒഴിവാക്കുക X</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">പേരും വീട്ടുപേരും:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg name" required></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">ഫോൺ നമ്പർ:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg phone"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">ഗൃഹനാഥനുമായുള്ള ബന്ധം:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg relation"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">ജനന തീയ്യതി:</label><input type="date" class="w-full bg-white border border-gray-300 p-2 rounded-lg dob"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">ജോലി:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg job"></div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">സ്വദേശത്തോ വിദേശത്തോ:</label>
                        <select class="w-full bg-white border border-gray-300 p-2 rounded-lg location"><option value="സ്വദേശം">സ്വദേശം</option><option value="വിദേശം">വിദേശം</option></select>
                    </div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">മതം:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg religion" value="ഇസ്ലാം"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">വിദ്യാഭ്യാസ യോഗ്യത:</label><input type="text" class="w-full bg-white border border-gray-300 p-2 rounded-lg education"></div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">വൈവാഹിക സ്ഥിതി:</label>
                        <select class="w-full bg-white border border-gray-300 p-2 rounded-lg marital"><option value="അവിവാഹിതം">അവിവാഹിതം</option><option value="വിവാഹിതം">വിവാഹിതം</option></select>
                    </div>
                </div>
            `;
            container.appendChild(newCard);
            updateSerialNumbers();
        }

        function removeRow(btn) {
            const card = btn.closest('.member-card');
            const container = document.getElementById('memberRows');
            if (container.children.length > 1) {
                card.remove();
                updateSerialNumbers();
            } else {
                alert('കുറഞ്ഞത് ഒരു അംഗത്തിന്റെ വിവരമെങ്കിലും ഉണ്ടായിരിക്കണം!');
            }
        }

        // Form Submit Handler
        document.getElementById('mahalluForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const grihanathan = document.getElementById('grihanathan').value;
            const veettuperu = document.getElementById('veettuperu').value;
            const panchayat = document.getElementById('panchayat').value;
            const wardNo = document.getElementById('wardNo').value;
            const houseNo = document.getElementById('houseNo').value;
            const mahallu = document.getElementById('mahallu').value;

            let members = [];
            document.querySelectorAll('.member-card').forEach((card, index) => {
                members.push({
                    slNo: index + 1,
                    name: card.querySelector('.name').value,
                    phone: card.querySelector('.phone').value,
                    relation: card.querySelector('.relation').value,
                    dob: card.querySelector('.dob').value,
                    job: card.querySelector('.job').value,
                    location: card.querySelector('.location').value,
                    religion: card.querySelector('.religion').value,
                    education: card.querySelector('.education').value,
                    marital: card.querySelector('.marital').value
                });
            });

            const formData = { grihanathan, veettuperu, panchayat, wardNo, houseNo, mahallu, members, timestamp: new Date().toISOString() };

            database.ref('mahallu_surveys/' + Date.now()).set(formData)
                .then(() => {
                    alert('വിവരങ്ങൾ വിജയകരമായി സേവ് ചെയ്തു!');
                    document.getElementById('mahalluForm').reset();
                    document.getElementById('memberRows').innerHTML = '';
                    addRow();
                })
                .catch((error) => alert('പിശക്: ' + error.message));
        });

        // Load Admin Data from Firebase
        function loadAdminData() {
            database.ref('mahallu_surveys').on('value', (snapshot) => {
                const data = snapshot.val();
                allSurveysData = data || {};
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                
                let keys = Object.keys(allSurveysData);
                document.getElementById('totalCount').innerText = keys.length;

                if(keys.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-gray-500">ഡാറ്റ ഒന്നും ലഭ്യമല്ല</td></tr>`;
                    return;
                }

                keys.forEach((key, index) => {
                    let item = allSurveysData[key];
                    let tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition";
                    tr.innerHTML = `
                        <td class="px-3 py-3 text-center font-bold">${index + 1}</td>
                        <td class="px-3 py-3 font-semibold text-emerald-900">${item.grihanathan}</td>
                        <td class="px-3 py-3">${item.veettuperu}</td>
                        <td class="px-3 py-3 text-center">വാർഡ്: ${item.wardNo || '-'} / വീട്: ${item.houseNo || '-'}</td>
                        <td class="px-3 py-3 text-center"><span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full text-xs font-bold">${item.members ? item.members.length : 0} പേർ</span></td>
                        <td class="px-3 py-3 text-center space-x-2">
                            <button onclick="viewDetails('${key}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-bold">വിവരങ്ങൾ</button>
                            <button onclick="deleteRecord('${key}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-bold">ഡിലീറ്റ്</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // View Details Modal
        function viewDetails(key) {
            let item = allSurveysData[key];
            if(!item) return;

            let html = `
                <div class="bg-emerald-50 p-4 rounded-xl border mb-4">
                    <p><strong>ഗൃഹനാഥൻ:</strong> ${item.grihanathan}</p>
                    <p><strong>വീട്ടുപേര്:</strong> ${item.veettuperu}</p>
                    <p><strong>പഞ്ചായത്ത് / വാർഡ് / വീട് നമ്പർ:</strong> ${item.panchayat || '-'} / ${item.wardNo || '-'} / ${item.houseNo || '-'}</p>
                </div>
                <h4 class="font-bold text-gray-800 mb-2">കുടുംബാംഗങ്ങളുടെ പട്ടിക:</h4>
                <div class="space-y-3">
            `;

            if(item.members && item.members.length > 0) {
                item.members.forEach((m, idx) => {
                    html += `
                        <div class="bg-gray-50 p-3 rounded-lg border text-xs space-y-1">
                            <p class="font-bold text-emerald-800">അംഗം #${idx + 1}: ${m.name}</p>
                            <p>ബന്ധം: ${m.relation || '-'} | ഫോൺ: ${m.phone || '-'} | ജനന തീയ്യതി: ${m.dob || '-'}</p>
                            <p>ജോലി: ${m.job || '-'} (${m.location || '-'}) | വിദ്യാഭ്യാസം: ${m.education || '-'} | വൈവാഹിക സ്ഥിതി: ${m.marital || '-'}</p>
                        </div>
                    `;
                });
            } else {
                html += `<p class="text-gray-500 text-xs">അംഗങ്ങളുടെ വിവരങ്ങൾ ലഭ്യമല്ല.</p>`;
            }

            html += `</div>`;
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('flex');
            document.getElementById('detailModal').classList.add('hidden');
        }

        // Delete Record
        function deleteRecord(key) {
            if(confirm('തീർച്ചയായും ഈ വിവരങ്ങൾ ഡിലീറ്റ് ചെയ്യണമെന്നുണ്ടോ?')) {
                database.ref('mahallu_surveys/' + key).remove()
                    .then(() => alert('വിജയകരമായി ഡിലീറ്റ് ചെയ്തു!'))
                    .catch(err => alert('പിശക്: ' + err.message));
            }
        }

        // Search/Filter Function
        function filterTable() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let rows = document.getElementById('tableBody').getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                let tdName = rows[i].getElementsByTagName('td')[1];
                let tdHouse = rows[i].getElementsByTagName('td')[2];
                if (tdName || tdHouse) {
                    let nameValue = tdName.textContent || tdName.innerText;
                    let houseValue = tdHouse.textContent || tdHouse.innerText;
                    if (nameValue.toLowerCase().indexOf(input) > -1 || houseValue.toLowerCase().indexOf(input) > -1) {
                        rows[i].style.display = "";
                    } else {
                        rows[i].style.display = "none";
                    }
                }
            }
        }
    </script>
</body>
</html>
