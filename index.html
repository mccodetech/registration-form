<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahallu Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-100 p-4 md:p-8 min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-2xl border border-emerald-100 mt-10">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-emerald-900">Mahallu Software Login</h2>
            <p class="text-xs text-gray-600 mt-1">Enter your username and password</p>
        </div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Username / Email:</label>
                <input type="text" id="loginUsername" required class="w-full border p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Password:</label>
                <input type="password" id="loginPassword" required class="w-full border p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow transition">Login</button>
        </form>
        <div class="mt-6 text-center border-t pt-4">
            <button type="button" onclick="toggleRegisterForm()" class="text-emerald-700 font-bold text-xs hover:underline">New Mahallu? Click here to Register</button>
        </div>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerScreen" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-2xl border border-emerald-100 mt-10 hidden">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-emerald-900">New Mahallu Registration</h2>
            <p class="text-xs text-gray-600 mt-1">Submit your details for Super Admin approval</p>
        </div>
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Mahallu Name:</label>
                <input type="text" id="regMahalluName" required class="w-full border p-2.5 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Email ID:</label>
                <input type="email" id="regEmail" required class="w-full border p-2.5 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Password:</label>
                <input type="password" id="regPassword" required class="w-full border p-2.5 rounded-lg text-sm">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition">Send Registration Request</button>
        </form>
        <div class="mt-6 text-center border-t pt-4">
            <button type="button" onclick="toggleRegisterForm()" class="text-gray-600 font-bold text-xs hover:underline">Back to Login</button>
        </div>
    </div>

    <!-- SUPER ADMIN DASHBOARD -->
    <div id="superAdminApp" class="max-w-6xl mx-auto bg-white/90 backdrop-blur-md p-6 md:p-10 rounded-2xl shadow-2xl border border-emerald-100 hidden">
        <div class="bg-indigo-900 text-white p-4 rounded-xl mb-6 flex justify-between items-center shadow-md">
            <h2 class="text-lg font-bold">Super Admin Panel</h2>
            <button onclick="logout()" class="bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-lg">Log Out</button>
        </div>
        <div class="overflow-x-auto bg-white rounded-xl border shadow-sm">
            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead class="bg-indigo-800 text-white text-xs">
                    <tr>
                        <th class="px-3 py-3 text-center">No</th>
                        <th class="px-3 py-3 text-left">Mahallu Name</th>
                        <th class="px-3 py-3 text-left">Email</th>
                        <th class="px-3 py-3 text-center">Status</th>
                        <th class="px-3 py-3 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200 text-gray-700" id="approvalTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="mainApp" class="max-w-6xl mx-auto bg-white/90 backdrop-blur-md p-6 md:p-10 rounded-2xl shadow-2xl border border-emerald-100 hidden">
        <div class="bg-emerald-900 text-white p-4 rounded-xl mb-6 flex justify-between items-center shadow-md">
            <h2 id="loggedInMahalluName" class="text-lg font-bold">Mahallu Name</h2>
            <button onclick="logout()" class="bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-lg">Log Out</button>
        </div>
        <form id="mahalluForm" class="space-y-6">
            <div class="bg-emerald-50/60 p-6 rounded-xl border">
                <h2 class="text-md font-bold text-emerald-800 mb-4">Household Details</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="grihanathan" placeholder="Grihanathan Name" required class="border p-2.5 rounded-lg text-sm">
                    <input type="text" id="veettuperu" placeholder="House Name" required class="border p-2.5 rounded-lg text-sm">
                    <input type="text" id="panchayat" placeholder="Panchayat" class="border p-2.5 rounded-lg text-sm">
                </div>
            </div>
            <button type="submit" class="bg-emerald-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg">Save Details</button>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzGRBflOY8-cNjECWGaPPOA-i4zrGfeIY",
            authDomain: "registration-form-bbacd.firebaseapp.com",
            databaseURL: "https://registration-form-bbacd-default-rtdb.asia-southeast1.firebasedatabase.com",
            projectId: "registration-form-bbacd",
            storageBucket: "registration-form-bbacd.firebasestorage.app",
            messagingSenderId: "729788425514",
            appId: "1:729788425514:web:e78dee44b1383ba2082a53",
            measurementId: "G-NWVDCF3DXM"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let currentMahalluKey = "";

        function toggleRegisterForm() {
            document.getElementById('loginScreen').classList.toggle('hidden');
            document.getElementById('registerScreen').classList.toggle('hidden');
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let name = document.getElementById('regMahalluName').value;
            let email = document.getElementById('regEmail').value.trim();
            let password = document.getElementById('regPassword').value;
            let emailKey = email.replace(/[.#$\/\[\]]/g, '_');

            let regData = {
                name: name,
                email: email,
                password: password,
                status: "Pending",
                expiryDate: "2027-12-31"
            };

            database.ref('registered_mahallus/' + emailKey).set(regData)
                .then(() => {
                    alert('Registration request submitted successfully!');
                    document.getElementById('registerForm').reset();
                    toggleRegisterForm();
                })
                .catch(err => {
                    alert('Error: ' + err.message);
                });
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let username = document.getElementById('loginUsername').value.trim();
            let password = document.getElementById('loginPassword').value;

            if(username === "sadmin" && password === "admin123") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('superAdminApp').classList.remove('hidden');
                loadSuperAdminApprovals();
                return;
            }

            let emailKey = username.replace(/[.#$\/\[\]]/g, '_');
            database.ref('registered_mahallus/' + emailKey).once('value').then(snapshot => {
                let mahallu = snapshot.val();
                if(mahallu && mahallu.password === password) {
                    if(mahallu.status !== "Approved") {
                        alert('Your account is pending approval.');
                        return;
                    }
                    currentMahalluKey = emailKey;
                    document.getElementById('loggedInMahalluName').innerText = mahallu.name;
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                } else {
                    alert('Invalid username or password!');
                }
            });
        });

        function logout() {
            location.reload();
        }

        function loadSuperAdminApprovals() {
            database.ref('registered_mahallus').on('value', snapshot => {
                let data = snapshot.val() || {};
                let tbody = document.getElementById('approvalTableBody');
                tbody.innerHTML = '';
                let keys = Object.keys(data);
                
                if(keys.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-gray-500">No registrations found</td></tr>`;
                    return;
                }

                keys.forEach((key, index) => {
                    let item = data[key];
                    let statusBadge = item.status === "Approved" ? 
                        `<span class="bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-bold">Approved</span>` : 
                        `<span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded-full text-xs font-bold">Pending</span>`;
                    
                    tbody.innerHTML += `<tr>
                        <td class="px-3 py-3 text-center">${index + 1}</td>
                        <td class="px-3 py-3 font-semibold">${item.name}</td>
                        <td class="px-3 py-3">${item.email}</td>
                        <td class="px-3 py-3 text-center">${statusBadge}</td>
                        <td class="px-3 py-3 text-center space-x-2">
                            <button onclick="approveMahallu('${key}')" class="bg-green-600 text-white px-3 py-1 rounded text-xs font-bold">Approve</button>
                            <button onclick="rejectMahallu('${key}')" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold">Reject</button>
                        </td>
                    </tr>`;
                });
            });
        }

        function approveMahallu(key) {
            database.ref(`registered_mahallus/${key}`).update({ status: "Approved" }).then(() => {
                alert('Mahallu approved successfully!');
            });
        }

        function rejectMahallu(key) {
            if(confirm('Are you sure you want to delete this Mahallu?')) {
                database.ref(`registered_mahallus/${key}`).remove();
            }
        }
    </script>
</body>
</html>
