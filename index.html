<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മഹല്ല് മാനേജ്മെന്റ് സിസ്റ്റം (SaaS)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Manjari for Malayalam) -->
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-100 p-4 md:p-8 min-h-screen">

    <!-- 1. LOGIN SCREEN (Initially Visible) -->
    <div id="loginScreen" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-2xl border border-emerald-100 mt-20">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-emerald-900">🕌 മഹല്ല് സോഫ്റ്റ്‌വെയർ ലോഗിൻ</h2>
            <p class="text-xs text-gray-600 mt-1">നിങ്ങളുടെ മഹല്ല് ഇമെയിലും പാസ്‌വേർഡും നൽകി പ്രവേശിക്കുക</p>
        </div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">മഹല്ല് ഇമെയിൽ ഐഡി:</label>
                <input type="email" id="loginEmail" required class="w-full border p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" placeholder="mahallu@gmail.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">പാസ്‌വേർഡ്:</label>
                <input type="password" id="loginPassword" required class="w-full border p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" placeholder="********">
            </div>
            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow transition">ലോഗിൻ ചെയ്യുക</button>
        </form>
    </div>

    <!-- 2. MAIN APP DASHBOARD (Hidden until login) -->
    <div id="mainApp" class="max-w-6xl mx-auto bg-white/90 backdrop-blur-md p-6 md:p-10 rounded-2xl shadow-2xl border border-emerald-100 hidden">
        
        <!-- Mahallu Header & Logout Bar -->
        <div class="bg-emerald-900 text-white p-4 rounded-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-md">
            <div>
                <h2 id="loggedInMahalluName" class="text-lg font-bold">മഹല്ല് പേര്</h2>
                <p class="text-xs text-emerald-200">കാലാവധി (Expiry Date): <span id="expiryDateDisplay" class="font-bold text-yellow-300">-</span></p>
            </div>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition">ലോഗ് ഔട്ട് ചെയ്യുക</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-emerald-900">സ്ഥിതി വിവര കണക്ക് & സർവ്വെ</h1>
            </div>
            <div class="flex gap-2 bg-emerald-100 p-1 rounded-xl">
                <button onclick="switchTab('form')" id="tabForm" class="px-4 py-2 rounded-lg text-sm font-bold bg-emerald-700 text-white shadow transition">സർവ്വെ ഫോം</button>
                <button onclick="switchTab('admin')" id="tabAdmin" class="px-4 py-2 rounded-lg text-sm font-bold text-emerald-800 hover:bg-emerald-200 transition">ഡാഷ്‌ബോർഡ്</button>
            </div>
        </div>

        <!-- SURVEY FORM SECTION -->
        <div id="sectionForm">
            <form id="mahalluForm" class="space-y-6">
                <div class="bg-emerald-50/60 p-6 rounded-xl border border-emerald-200/60 shadow-sm">
                    <h2 class="text-md font-bold text-emerald-800 mb-4">🏠 ഗൃഹ വിവരങ്ങൾ</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">ഗൃഹനാഥൻ്റെ പേര്:</label><input type="text" id="grihanathan" required class="w-full bg-white border p-2.5 rounded-lg text-sm"></div>
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">വീട്ടുപേര്:</label><input type="text" id="veettuperu" required class="w-full bg-white border p-2.5 rounded-lg text-sm"></div>
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">പഞ്ചായത്ത്:</label><input type="text" id="panchayat" class="w-full bg-white border p-2.5 rounded-lg text-sm"></div>
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">വാർഡ് നമ്പർ:</label><input type="text" id="wardNo" class="w-full bg-white border p-2.5 rounded-lg text-sm"></div>
                        <div><label class="block text-xs font-bold text-gray-700 mb-1">വീട് നമ്പർ:</label><input type="text" id="houseNo" class="w-full bg-white border p-2.5 rounded-lg text-sm"></div>
                    </div>
                </div>

                <!-- Members Section -->
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-800">👥 അംഗങ്ങളുടെ വിവരങ്ങൾ</h3>
                        <button type="button" onclick="addRow()" class="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg">+ അംഗത്തെ ചേർക്കുക</button>
                    </div>
                    <div id="memberRows" class="space-y-4">
                        <div class="member-card bg-gray-50 p-5 rounded-xl border relative">
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                                <div><label class="block text-xs font-bold mb-1">പേര്:</label><input type="text" class="w-full bg-white border p-2 rounded-lg name" required></div>
                                <div><label class="block text-xs font-bold mb-1">ഫോൺ:</label><input type="text" class="w-full bg-white border p-2 rounded-lg phone"></div>
                                <div><label class="block text-xs font-bold mb-1">ബന്ധം:</label><input type="text" class="w-full bg-white border p-2 rounded-lg relation"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center pt-6 border-t">
                    <button type="submit" class="bg-emerald-600 text-white font-bold px-8 py-3 rounded-xl shadow-lg w-full md:w-auto">വിവരങ്ങൾ സേവ് ചെയ്യുക</button>
                </div>
            </form>
        </div>

        <!-- ADMIN TABLE SECTION -->
        <div id="sectionAdmin" class="hidden space-y-6">
            <div class="overflow-x-auto bg-white rounded-xl border shadow-sm">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-emerald-800 text-white text-xs">
                        <tr>
                            <th class="px-3 py-3 text-center">നമ്പർ</th>
                            <th class="px-3 py-3 text-left">ഗൃഹനാഥൻ</th>
                            <th class="px-3 py-3 text-left">വീട്ടുപേര്</th>
                            <th class="px-3 py-3 text-center">പ്രവർത്തനങ്ങൾ</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 text-gray-700" id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzGRBflOY8-cNjECWGaPPOA-i4zrGfeIY",
            authDomain: "registration-form-bbacd.firebaseapp.com",
            projectId: "registration-form-bbacd",
            storageBucket: "registration-form-bbacd.firebasestorage.app",
            messagingSenderId: "729788425514",
            appId: "1:729788425514:web:e78dee44b1383ba2082a53",
            measurementId: "G-NWVDCF3DXM"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentMahalluKey = "";

        // Login Handler with Expiry Check
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let email = document.getElementById('loginEmail').value.trim().replace('.', '_');
            let password = document.getElementById('loginPassword').value;

            database.ref('registered_mahallus/' + email).once('value').then(snapshot => {
                let mahallu = snapshot.val();
                if(mahallu && mahallu.password === password) {
                    // Check Expiry Date
                    let today = new Date().toISOString().split('T')[0];
                    if(mahallu.expiryDate && mahallu.expiryDate < today) {
                        alert('⚠️ നിങ്ങളുടെ സോഫ്റ്റ്‌വെയർ ആക്സസ് കാലാവധി അവസാനിച്ചിരിക്കുന്നു. ദയവായി പുതുക്കുക.');
                        return;
                    }

                    currentMahalluKey = email;
                    document.getElementById('loggedInMahalluName').innerText = mahallu.name;
                    document.getElementById('expiryDateDisplay').innerText = mahallu.expiryDate || 'Unlimited';
                    
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    loadAdminData();
                } else {
                    alert('തെറ്റായ ഇമെയിൽ അല്ലെങ്കിൽ പാസ്‌വേർഡ്!');
                }
            });
        });

        function logout() {
            location.reload();
        }

        function switchTab(tab) {
            if(tab === 'form') {
                document.getElementById('sectionForm').classList.remove('hidden');
                document.getElementById('sectionAdmin').classList.add('hidden');
            } else {
                document.getElementById('sectionForm').classList.add('hidden');
                document.getElementById('sectionAdmin').classList.remove('hidden');
                loadAdminData();
            }
        }

        function addRow() {
            let container = document.getElementById('memberRows');
            let div = document.createElement('div');
            div.className = "member-card bg-gray-50 p-5 rounded-xl border relative";
            div.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-sm">
                <div><label class="block text-xs font-bold mb-1">പേര്:</label><input type="text" class="w-full bg-white border p-2 rounded-lg name" required></div>
                <div><label class="block text-xs font-bold mb-1">ഫോൺ:</label><input type="text" class="w-full bg-white border p-2 rounded-lg phone"></div>
                <div><label class="block text-xs font-bold mb-1">ബന്ധം:</label><input type="text" class="w-full bg-white border p-2 rounded-lg relation"></div>
            </div>`;
            container.appendChild(div);
        }

        document.getElementById('mahalluForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let formData = {
                grihanathan: document.getElementById('grihanathan').value,
                veettuperu: document.getElementById('veettuperu').value,
                panchayat: document.getElementById('panchayat').value,
                wardNo: document.getElementById('wardNo').value,
                houseNo: document.getElementById('houseNo').value
            };

            database.ref(`mahallu_data/${currentMahalluKey}/surveys/` + Date.now()).set(formData).then(() => {
                alert('വിജയകരമായി സേവ് ചെയ്തു!');
                document.getElementById('mahalluForm').reset();
            });
        });

        function loadAdminData() {
            database.ref(`mahallu_data/${currentMahalluKey}/surveys`).on('value', snapshot => {
                let data = snapshot.val() || {};
                let tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                let keys = Object.keys(data);
                if(keys.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-gray-500">ഡാറ്റ ഒന്നും ലഭ്യമല്ല</td></tr>`;
                    return;
                }
                keys.forEach((key, index) => {
                    let item = data[key];
                    tbody.innerHTML += `<tr>
                        <td class="px-3 py-3 text-center">${index + 1}</td>
                        <td class="px-3 py-3 font-semibold">${item.grihanathan}</td>
                        <td class="px-3 py-3">${item.veettuperu}</td>
                        <td class="px-3 py-3 text-center"><button onclick="deleteData('${key}')" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold">ഡിലീറ്റ്</button></td>
                    </tr>`;
                });
            });
        }

        function deleteData(key) {
            if(confirm('ഡിലീറ്റ് ചെയ്യണമെന്നുറപ്പാണോ?')) {
                database.ref(`mahallu_data/${currentMahalluKey}/surveys/` + key).remove();
            }
        }
    </script>
</body>
</html>
